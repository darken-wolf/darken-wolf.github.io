<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#251f21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دارك وولف | طلبات خامات الورش</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="brand">
  <img class="brand-icon" src="icon-192.png" alt="دارك وولف">
  <div>
    <div class="brand-name">دارك وولف</div>
    <div class="brand-sub">خامات وإكسسوارات للورش</div>
  </div>
</header>

<main>
  <p class="intro">اختار المنتجات والكميات، شوف الفاتورة والإجمالي، وابعت الطلب بضغطة واحدة.</p>
  <div id="demo-note" class="note" hidden>نسخة تجريبية: الأسعار والمنتجات أمثلة للتجربة بس.</div>

  <nav class="filters" id="filters" aria-label="الأقسام"></nav>

  <section id="grid" class="grid" aria-label="المنتجات"></section>

  <section id="cart-section" class="cart" aria-label="الفاتورة">
    <h2>طلبك</h2>
    <div id="cart-empty" class="empty">السلة فاضية لسه. اختار منتجات من الفهرس وهتظهر هنا بأسعارها.</div>
    <div id="cart-body" hidden>
      <ul id="lines" class="lines"></ul>
      <div class="grand"><span>الإجمالي</span><strong id="grand-total"></strong></div>
      <label class="field">اسم الورشة
        <input id="f-workshop" type="text" autocomplete="organization">
      </label>
      <label class="field">رقم التليفون
        <input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr">
      </label>
      <label class="field">ملاحظات (اختياري)
        <textarea id="f-notes" rows="2"></textarea>
      </label>
      <div class="actions">
        <button id="send-order" class="btn primary" type="button">إرسال الطلب</button>
        <button id="copy-order" class="btn ghost" type="button">نسخ الطلب</button>
      </div>
      <p id="send-hint" class="hint"></p>
    </div>
  </section>
</main>

<footer class="foot">دارك وولف — دمياط</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
